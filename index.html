<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freedman</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;

      /* Animated gradient background */
      background: linear-gradient(-45deg, #000000, #1a1a40, #0f2027, #2c5364);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: clamp(2.5rem, 10vw, 6rem);
      font-weight: 700;
      line-height: 1.2;
      word-break: break-word;
      max-width: 100%;
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    h1:hover {
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <h1>Freedman</h1>

<footer style="position: fixed; bottom: 30px; left: 0; width: 100%; text-align: center; z-index: 1000; color: rgba(255, 255, 255, 0.4); font-size: 0.9rem; font-family: -apple-system, sans-serif;">
    <span style="display: block; margin-bottom: 5px; color: rgba(255, 255, 255, 0.8); font-weight: 500;">StudioMemory Pro</span>
    <a href="privacy.html" style="color: rgba(255, 255, 255, 0.6); text-decoration: none;">Privacy</a>
    <span style="margin: 0 8px;">|</span>
    <a href="#" style="color: rgba(255, 255, 255, 0.6); text-decoration: none;">User Manual</a>
  </footer>

</body>
</html>
